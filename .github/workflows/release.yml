name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump -- required to start a new RC or stable release; leave "none" to continue an existing RC series'
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      create_rc:
        description: 'Create RC tag (checked = RC, unchecked = stable release)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    if: github.ref_name == 'main' || endsWith(github.ref_name, '.rc') || endsWith(github.ref_name, '.x-maintenance')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CREATE_RC: ${{ inputs.create_rc }}
        shell: bash
        run: |
          git fetch --tags --force origin

          if [ "$BUMP" = "none" ] && [ "$CREATE_RC" != "true" ]; then
            echo "ERROR: Select a bump type or enable 'Create RC'."
            exit 1
          fi

          branch="${GITHUB_REF_NAME}"

          # Bump a vX.Y.Z string by the requested level
          bump_stable() {
            local ver="${1#v}" major minor patch
            IFS='.' read -r major minor patch <<< "$ver"
            case "$2" in
              major) echo "v$((major+1)).0.0" ;;
              minor) echo "v${major}.$((minor+1)).0" ;;
              patch) echo "v${major}.${minor}.$((patch+1))" ;;
            esac
          }

          # Find the latest stable tag (scoped to major.minor for maintenance branches)
          if [[ "$branch" =~ ^([0-9]+)\.([0-9]+)\.x-maintenance$ ]]; then
            latest_stable="$(git tag --list "v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.*" --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          else
            latest_stable="$(git tag --list 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          fi
          [ -z "$latest_stable" ] && latest_stable="v0.0.0"

          is_rc=false
          next=""
          baseline=""

          if [ "$CREATE_RC" = "true" ] && [ "$BUMP" != "none" ]; then
            # New RC series: bump stable version and start at rc1
            next_stable="$(bump_stable "$latest_stable" "$BUMP")"
            next="${next_stable}.rc1"
            baseline="$latest_stable"
            is_rc=true

          elif [ "$CREATE_RC" = "true" ] && [ "$BUMP" = "none" ]; then
            # Continue existing RC series: find the highest rcN globally and increment
            last_rc="$(git tag --list 'v*.rc*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.rc[0-9]+$' | head -1)"
            if [ -z "$last_rc" ]; then
              echo "ERROR: No existing RC tag found. Select a bump type to start a new RC series."
              exit 1
            fi
            next_stable="${last_rc%%.rc*}"
            # Reject if the RC's base version is already released as stable
            if git tag --list "$next_stable" | grep -qxF "$next_stable"; then
              echo "ERROR: ${next_stable} is already released as stable. Select a bump type to start a new RC series."
              exit 1
            fi
            last_rc_num="${last_rc##*.rc}"
            next="${next_stable}.rc$((last_rc_num + 1))"
            baseline="$last_rc"
            is_rc=true

          else
            # Stable release
            next="$(bump_stable "$latest_stable" "$BUMP")"
            baseline="$latest_stable"
          fi

          echo "baseline=$baseline" | tee -a "$GITHUB_OUTPUT"
          echo "next=$next"         | tee -a "$GITHUB_OUTPUT"
          echo "is_rc=$is_rc"       | tee -a "$GITHUB_OUTPUT"

      - name: Validate release has changes
        env:
          BASELINE: ${{ steps.version.outputs.baseline }}
        shell: bash
        run: |
          if [ "$BASELINE" = "v0.0.0" ]; then
            echo "No previous tag found; proceeding with initial release."
            exit 0
          fi
          count="$(git rev-list --count "${BASELINE}..HEAD")"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No new commits since ${BASELINE}; refusing to create a duplicate release."
            exit 1
          fi

      - name: Validate CHANGELOG
        shell: bash
        run: |
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has an [Unreleased] section. Update it before releasing."
            exit 1
          fi

      - name: Build release archive
        id: asset
        env:
          VERSION: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          bare="${VERSION#v}"
          ./.github/scripts/mk-release-package.sh \
            --version "${bare}" \
            --package firebolt-cpp-transport
          awk '/^## / { if (s) exit; s=1 } s{ print }' CHANGELOG.md > release_notes.md
          echo "archive=build/firebolt-cpp-transport-${bare}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          TAG: ${{ steps.version.outputs.next }}
          IS_RC: ${{ steps.version.outputs.is_rc }}
          ARCHIVE: ${{ steps.asset.outputs.archive }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          release_flags=()
          [ "$IS_RC" = "true" ] && release_flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            # No tag is pushed beforehand -- the Releases API creates it here,
            # pointing at TARGET_SHA. This avoids pushing a bare tag ref directly,
            # which the repo's tag ruleset rejects.
            gh release create "$TAG" \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file release_notes.md \
              "${release_flags[@]}" \
              "$ARCHIVE"
          fi
